<!-- fragmento 1 para mostrar las categorias en "tabs" -->
<section th:fragment="tabs" class="py-3 mb-4">
    <div class="d-flex justify-content-center px-5">
        <ul class="nav nav-underline">

            <!-- Tab Todas -->
            <li class="nav-item">
                <a class="nav-link"
                   th:classappend="${idCategoriaSeleccionada == null} ? ' active'"
                   th:attr="aria-current=${idCategoriaSeleccionada == null ? 'page' : null}"
                   th:href="@{/}">
                    Todas
                </a>
            </li>

            <!-- Tabs dinámicos de categorías -->
            <li class="nav-item"
                th:if="${categorias != null}"
                th:each="c : ${categorias}">

                <a class="nav-link"
                   th:text="${c.descripcion}"
                   th:classappend="${idCategoriaSeleccionada != null and idCategoriaSeleccionada == c.idCategoria} ? ' active'"
                   th:attr="aria-current=${idCategoriaSeleccionada != null and idCategoriaSeleccionada == c.idCategoria ? 'page' : null}"
                   th:href="@{/consultas/{id}(id=${c.idCategoria})}">
                </a>
            </li>

        </ul>
    </div>
</section>

<!-- fragmento 2 para mostrar los productos en "tarjetas" -->
<section th:fragment="tarjetas" class="container">
    <div class="row g-4">

        <!-- Si no hay productos -->
        <div class="col-12" th:if="${productos == null or #lists.isEmpty(productos)}">
            <div class="alert alert-warning text-center mb-0">
                No hay productos para esta categoría.
            </div>
        </div>

        <!-- Tarjetas de productos -->
        <div class="col-12 col-sm-6 col-md-4 col-lg-3"
             th:each="p : ${productos}"
             th:if="${productos != null and !#lists.isEmpty(productos)}">

            <div class="card h-100 shadow-sm">

                <!-- Imagen -->
                <img class="card-img-top"
                     th:src="${(p.rutaImagen != null and !#strings.isEmpty(p.rutaImagen)) ? p.rutaImagen : '/img/no-image.png'}"
                     th:alt="${p.descripcion}">

                <div class="card-body d-flex flex-column">

                    <!-- Título -->
                    <h6 class="card-title text-center mb-2"
                        th:text="${p.descripcion}">
                    </h6>

                    <!-- Detalle (1 línea, controlado por CSS con .product-desc) -->
                    <p class="product-desc text-muted mb-3"
                       th:if="${p.detalle != null and !#strings.isEmpty(p.detalle)}"
                       th:text="${p.detalle}">
                    </p>

                    <div class="mt-auto d-flex justify-content-between align-items-center">

                        <!-- Precio + stock -->
                        <div class="d-flex align-items-center gap-2">
                            <span class="price-green"
                                  th:text="'₡ ' + ${#numbers.formatDecimal(p.precio, 1, 'POINT', 2, 'COMMA')}">
                            </span>

                            <span class="badge text-bg-secondary"
                                  th:text="${p.existencias} + ' unidades'">
                            </span>
                        </div>

                        <!-- Botón carrito -->
                        <form action="/carrito/agregar" method="post" class="d-inline">

                            <input type="hidden"
                                   name="idProducto"
                                   th:value="${p.idProducto}" />

                            <button type="submit"
                                    class="btn btn-sm btn-primary"
                                    th:disabled="${p.existencias < 1}"
                                    onclick="addCart(this.form)">
                                <i class="fa-solid fa-cart-shopping"></i>
                            </button>

                        </form>

                    </div>
                </div>
            </div>
        </div>

    </div>
</section>


<!-- Fragmento 3 fragmento que presenta las 3 consultas y la tarea #2 -->
<section th:fragment="consultas" class="row row-cols-4 -p2">
    <div th:replace="~{consultas/fragmentos :: formConsulta('primary',#{consultas.derivadas},'/consultas/consultaDerivada')}"></div>
    <div th:replace="~{consultas/fragmentos :: formConsulta('warning',#{consultas.jpql},'/consultas/consultaJPQL')}"></div>
    <div th:replace="~{consultas/fragmentos :: formConsulta('success',#{consultas.sql},'/consultas/consultaSQL')}"></div>
    <div class='card bg-danger p-2 text-center text-white'> 
        <h4>Aca va su practica #2</h4>
    </div>
</section>

<!-- Fragmento 4 fragmento del formulario con parametros -->
<div th:fragment="formConsulta(colorForm, textoForm, accionForm)">
    <form method="post" class="was-validated" th:action="@{${accionForm}}">
        <div class="card p-2">
            <div class="card-header text-center text-white" th:classappend="${'bg-'+colorForm}"> 
                <h4>[[${textoForm}]]</h4>
            </div>
            <div class="card-body">
                <div class='mb-3'>
                    <label> [[#{consultas.precio.inferior}]] </label>
                    <input type='number' name='precioInf' th:value='${precioInf}' class='form-control' min='0' required/>
                </div>
                <div class='mb-3'>
                    <label> [[#{consultas.precio.superior}]] </label>
                    <input type='number' name='precioSup' th:value='${precioSup}' class='form-control' min='0' required/>
                </div>
            </div>
            <div class="card-footer"> 
                <button type="submit" class="btn text-white" th:classappend="${'btn-'+colorForm}">
                    <i class='fa-solid fa-magnifying-glass'> </i> [[${textoForm}]]
                </button>
            </div>
        </div>

    </form>
</div>
